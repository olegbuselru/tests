<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Atlas TG</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;background:#05050f;">
<div id="root"></div>
<script type="text/babel">
const {useState, useEffect, useRef, useCallback} = React;
const MACRO=[{id:0,label:"Технологии",color:"#4f8ef7"},{id:1,label:"Финансы",color:"#2ecc71"},{id:2,label:"Политика",color:"#e74c3c"},{id:3,label:"ИИ / ML",color:"#a855f7"},{id:4,label:"Крипто",color:"#f59e0b"},{id:5,label:"Медиа",color:"#eab308"},{id:6,label:"Спорт",color:"#10b981"},{id:7,label:"Здоровье",color:"#ec4899"},{id:8,label:"Образование",color:"#818cf8"},{id:9,label:"Развлечения",color:"#84cc16"},{id:10,label:"Наука",color:"#06b6d4"},{id:11,label:"Путешествия",color:"#f97316"}];

function mkRng(seed){let s=seed;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};}

function buildPoints(channels){
  const r=mkRng(42);
  const centers=MACRO.map((_,i)=>{const a=(i/12)*Math.PI*2-Math.PI/2,rd=0.45+r()*0.22;return[Math.cos(a)*rd,Math.sin(a)*rd];});
  return channels.map((ch,id)=>{
    const [cx,cy]=centers[ch.macro];
    const u1=r()+1e-9,u2=r(),rd=Math.sqrt(-2*Math.log(u1))*0.09,an=u2*Math.PI*2;
    return {...ch,id,x:cx+Math.cos(an)*rd,y:cy+Math.sin(an)*rd};
  });
}

function App(){
  const cvRef=useRef(null); const cam=useRef({x:0,y:0,zoom:1.8});
  const [points,setPoints]=useState([]); const [sel,setSel]=useState(null); const [q,setQ]=useState("");
  const [res,setRes]=useState([]); const [fMac,setFMac]=useState(null); const [sidebar,setSidebar]=useState(false);

  useEffect(()=>{fetch('/api/channels').then(r=>r.json()).then(d=>setPoints(buildPoints(d.channels||[])));},[]);

  const draw=useCallback(()=>{
    const cv=cvRef.current; if(!cv) return;
    const W=window.innerWidth,H=window.innerHeight; cv.width=W;cv.height=H;
    const ctx=cv.getContext('2d'); const c=cam.current; const sc=Math.min(W,H)/2*c.zoom;
    ctx.fillStyle="#05050f"; ctx.fillRect(0,0,W,H);
    points.forEach(p=>{
      if(fMac!==null && p.macro!==fMac) return;
      const sx=W/2+(p.x-c.x)*sc, sy=H/2+(p.y-c.y)*sc;
      const br=2+Math.log10((p.subs||1000)+10)*0.4;
      ctx.beginPath(); ctx.arc(sx,sy,br,0,Math.PI*2);
      ctx.fillStyle=MACRO[p.macro].color; ctx.fill();
    });
    if(sel){
      const sx=W/2+(sel.x-c.x)*sc, sy=H/2+(sel.y-c.y)*sc;
      ctx.beginPath(); ctx.arc(sx,sy,8,0,Math.PI*2); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    }
  },[points,sel,fMac]);

  useEffect(()=>{draw(); const onR=()=>draw(); window.addEventListener('resize',onR); return ()=>window.removeEventListener('resize',onR)},[draw]);

  useEffect(()=>{
    if(!q.trim()){setRes([]);return;}
    const ql=q.toLowerCase();
    setRes(points.filter(p=>p.name.toLowerCase().includes(ql)||p.micro.toLowerCase().includes(ql)||p.handle.toLowerCase().includes(ql)).slice(0,8));
  },[q,points]);

  useEffect(()=>{
    const cv=cvRef.current; if(!cv) return;
    const onClick=(e)=>{
      const rect=cv.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
      const W=window.innerWidth,H=window.innerHeight,c=cam.current,sc=Math.min(W,H)/2*c.zoom;
      let best=null,bd=16*16;
      points.forEach(p=>{if(fMac!==null && p.macro!==fMac) return; const px=W/2+(p.x-c.x)*sc,py=H/2+(p.y-c.y)*sc,d=(px-x)**2+(py-y)**2; if(d<bd){bd=d;best=p;}});
      setSel(best);
    };
    cv.addEventListener('click',onClick); return ()=>cv.removeEventListener('click',onClick);
  },[points,fMac]);

  useEffect(()=>draw(),[draw]);

  const B={background:"rgba(255,255,255,0.06)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:6,color:"#fff",cursor:"pointer"};
  return <div style={{width:"100vw",height:"100vh",position:"relative",fontFamily:"Inter,system-ui,sans-serif"}}>
    <canvas ref={cvRef} style={{display:'block'}}/>

    <div style={{position:'absolute',top:14,left:'50%',transform:'translateX(-50%)',zIndex:100}}>
      <input value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 Поиск каналов..." style={{width:280,padding:'8px 16px',borderRadius:24,background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.14)',color:'#fff'}}/>
      {res.length>0 && <div style={{marginTop:6,background:'rgba(8,8,22,0.97)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:10,overflow:'hidden'}}>
        {res.map(p=><div key={p.id} onMouseDown={()=>setSel(p)} style={{padding:'8px 12px',cursor:'pointer',color:'#fff'}}>{p.name} <span style={{opacity:.5,fontSize:12}}>{p.handle}</span></div>)}
      </div>}
    </div>

    <button onClick={()=>setSidebar(!sidebar)} style={{...B,position:'absolute',top:14,left:16,zIndex:100,padding:'8px 14px'}}>☰ Темы</button>
    <div style={{position:'absolute',top:0,left:sidebar?0:-262,width:252,height:'100%',background:'rgba(6,6,18,0.96)',borderRight:'1px solid rgba(255,255,255,0.07)',transition:'left .25s',overflowY:'auto',zIndex:90,paddingTop:60}}>
      <div onClick={()=>setFMac(null)} style={{padding:'8px 16px',color:'#fff',cursor:'pointer'}}>Все категории</div>
      {MACRO.map(m=><div key={m.id} onClick={()=>setFMac(fMac===m.id?null:m.id)} style={{padding:'8px 16px',cursor:'pointer',color:fMac===m.id?'#fff':'rgba(255,255,255,.6)'}}>{m.label}</div>)}
    </div>

    {sel && <div style={{position:'absolute',bottom:20,left:sidebar?272:20,width:320,background:'rgba(7,7,20,0.97)',border:'1px solid rgba(255,255,255,0.09)',borderRadius:13,padding:16,color:'#fff'}}>
      <div style={{fontWeight:700,marginBottom:4}}>{sel.name}</div>
      <div style={{opacity:.5,fontSize:12,marginBottom:10}}>{sel.handle}</div>
      <p style={{opacity:.75,fontSize:13,lineHeight:1.5}}>{sel.desc}</p>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
        <span style={{opacity:.55,fontSize:12}}>👥 {sel.subs.toLocaleString('ru-RU')} подп.</span>
        <a href={sel.url} target="_blank" rel="noopener noreferrer" style={{background:MACRO[sel.macro].color,borderRadius:7,padding:'7px 14px',color:'#fff',fontWeight:700,fontSize:12,textDecoration:'none',display:'inline-block'}}>Открыть канал ↗</a>
      </div>
    </div>}
  </div>
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
